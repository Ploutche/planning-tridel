name: Mettre à jour le planning

on:
  push:
    paths:
      - 'Classeur1.xlsx'
      - 'convertir_excel.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convertir:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Convertir Excel en JSON
        run: python convertir_excel.py

      - name: Enregistrer planning.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planning.json
          if git diff --cached --quiet; then
            echo 'Aucun changement à publier.'
          else
            git commit -m 'Mise à jour automatique du planning'
            git push
          fi
